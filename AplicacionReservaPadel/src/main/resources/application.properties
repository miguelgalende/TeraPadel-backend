spring.application.name=AplicacionReservaPadel
server.port=8090

springdoc.api-docs.path=/reserva-padel
springdoc.swagger-ui.path=/reserva-padel-ui

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/terapadel}

# --- Seguridad ---

jwt.secret=${JWT_SECRET:MiClaveSuperSeguraMuySecreta123!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Usuario administrador inicial ---
admin.default-email=${ADMIN_EMAIL:admin@terapadel.com}
admin.default-password=${ADMIN_PASSWORD:admin}